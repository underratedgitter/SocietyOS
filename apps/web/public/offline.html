<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d2a24" />
  <title>SocietyOS — Offline</title>
  <style>
    :root {
      --bg: #071915;
      --card-bg: #0e2922;
      --card-border: rgba(43, 114, 91, 0.35);
      --text: #f2f7ef;
      --muted: #8ca398;
      --accent: #22c55e;
      --amber: #f59e0b;
      --btn-bg: #1b4d3e;
      --btn-hover: #236552;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      line-height: 1.5;
    }
    .offline-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--amber);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--amber);
    }
    .brand-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .brand-title span {
      color: var(--accent);
    }
    .description {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 28px;
    }
    .info-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
      text-align: left;
    }
    .info-box strong {
      color: var(--text);
      display: block;
      margin-bottom: 4px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: var(--btn-bg);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: var(--btn-hover);
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="badge">
      <span class="badge-dot"></span>
      Offline Shell Active
    </div>
    <h1 class="brand-title">Society<span>OS</span></h1>
    <p class="description">
      No internet connection detected. You are viewing the local offline shell.
    </p>
    <div class="info-box">
      <strong>Offline Gate Security Notice</strong>
      Access gates continue to verify cached credentials and physical key fobs locally. Live pass issuance and sync will resume once connection is restored.
    </div>
    <button class="btn" onclick="window.location.reload()">
      Retry Connection
    </button>
  </div>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://societyos:societyos@localhost:5432/societyos?schema=public
  REDIS_URL: redis://localhost:6379
  MQTT_URL: mqtt://localhost:1883
  MQTT_TEST_URL: mqtt://localhost:1883
  JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production-0123456789
  CREDENTIAL_HMAC_KEY: ci-only-credential-key-not-for-production-0123456789
  CREDENTIAL_HMAC_KEY_ID: v1
  WEB_URL: http://localhost:3000
  APP_BASE_URL: http://localhost:3000
  COOKIE_SECURE: "false"
  ENABLE_SWAGGER: "true"

jobs:
  verify:
    name: Typecheck, tests and browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: societyos
          POSTGRES_PASSWORD: societyos
          POSTGRES_DB: societyos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U societyos -d societyos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.12-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @societyos/api exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @societyos/api db:deploy

      - name: Seed demo data
        run: pnpm --filter @societyos/api db:seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Start MQTT broker
        run: |
          docker run -d --name societyos-mqtt -p 1883:1883 \
            eclipse-mosquitto:2.1.2-alpine mosquitto -c /mosquitto-no-auth.conf
          for attempt in $(seq 1 30); do
            if docker exec societyos-mqtt mosquitto_pub -h 127.0.0.1 -t ci-ready -m ping; then exit 0; fi
            sleep 1
          done
          docker logs societyos-mqtt
          exit 1

      - name: API integration tests
        run: pnpm --filter @societyos/api test:e2e

      - name: Build API
        run: pnpm --filter @societyos/api build

      - name: Build web
        run: pnpm --filter @societyos/web build

      - name: Install Playwright Chromium
        run: pnpm --filter @societyos/web exec playwright install --with-deps chromium

      - name: Start API
        run: |
          pnpm --filter @societyos/api start > societyos-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:4000/api/v1/healthz >/dev/null; then exit 0; fi
            sleep 2
          done
          cat societyos-api.log
          exit 1

      - name: Start web
        run: |
          pnpm --filter @societyos/web dev > societyos-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat societyos-web.log
          exit 1

      - name: Browser workflow tests
        run: pnpm --filter @societyos/web test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Upload API logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-logs
          path: |
            societyos-api.log
            societyos-web.log
          retention-days: 7

  containers:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Prepare compose environment
        run: cp .env.production.example .env.production
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.prod.yml -f docker-compose.preview.yml config -q
      - name: Syntax-check ops scripts
        run: for script in infrastructure/scripts/*.sh; do sh -n "$script"; done
      - name: Build API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: societyos-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: societyos-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - lucide-react@1.65.0
  - '@nestjs/common@11.2.9'
  - '@nestjs/core@11.2.9'
  - '@nestjs/platform-express@11.2.9'
  - '@nestjs/testing@11.2.9'

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # Hikvision/Dahua terminals authenticate with a token in the URL path
  # (/api/v1/device-api/push/<token>/<vendor>). Log a redacted URI 
  # instead of $request so the token never reaches access logs.
  map $request_uri $log_uri {
    default $request_uri;
    "~*^(?<pre>/api/v1/device-api/push/)[^/?]+(?<post>/.*)$" "${pre}[redacted]$post";
  }

  log_format main '$remote_addr - $remote_user [$time_local] "$request_method $log_uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" request_time=$request_time';
  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 1m;

  gzip on;
  # Requests arrive through the TLS terminator; the default (off) skips
  # compression for any request carrying a Via header.
  gzip_proxied any;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  # Restore the client address set by the TLS terminator in front of this
  # proxy. Without it every request shares the terminator's IP, so the per-IP
  # limit below and the API (trust proxy = 1) see one client. The private
  # ranges cover Docker bridges, cloudflared and VPC load balancers; narrow
  # them to the terminator's address, or add your CDN's published ranges.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Accept only http/https from upstream; fall back to this hop's scheme.
  map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
    http http;
  }

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  limit_req_status 429;

  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 80;
    server_name _;

    # One owner per security header, so responses never carry duplicates:
    # Next.js (next.config.ts headers) sends X-Content-Type-Options,
    # X-Frame-Options, Referrer-Policy, Permissions-Policy and CSP for web
    # routes; helmet sends HSTS, COOP and the rest for the API. Nginx adds only
    # what its upstream lacks. A location with its own add_header does not
    # inherit these two.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /nginx-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    location = /healthz {
      access_log off;
      set $api_health "http://api:4000/api/v1/healthz";
      proxy_pass $api_health;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      # helmet does not send Permissions-Policy; it does send HSTS and COOP.
      add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    # Terminal event push: tokens in the path are redacted by $log_uri;
    # bodies may carry a face picture, so allow 2m here (API enforces 2 MB too).
    location /api/v1/device-api/push/ {
      client_max_body_size 2m;
      set $api_backend "http://api:4000";
      proxy_pass $api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_hide_header X-Powered-By;
    }

    location /api/ {
      limit_req zone=api_limit burst=60 nodelay;
      set $api_backend "http://api:4000";
      proxy_pass $api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_hide_header X-Powered-By;
      # helmet does not send Permissions-Policy; it does send HSTS and COOP.
      add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    # ZKTeco ADMS push terminals (hardcoded paths, plain-text bodies up to the API's 1 MB limit).
    location /iclock/ {
      limit_req zone=api_limit burst=60 nodelay;
      client_max_body_size 1m;
      set $api_backend "http://api:4000";
      proxy_pass $api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_hide_header X-Powered-By;
    }

    location /_next/static/ {
      set $web_backend "http://web:3000";
      proxy_pass $web_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # Nginx owns these for hashed assets; drop Next's copies.
      proxy_hide_header Cache-Control;
      proxy_hide_header X-Content-Type-Options;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff" always;
      access_log off;
    }

    location / {
      set $web_backend "http://web:3000";
      proxy_pass $web_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_read_timeout 60s;
      proxy_hide_header X-Powered-By;
    }
  }
}

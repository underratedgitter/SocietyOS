# SocietyOS production broker.
# Generate passwd + acl with infrastructure/scripts/generate-mqtt-credentials.sh.
# Terminate TLS on a private network or add a 8883 listener with certificates
# before exposing this broker outside the Docker network.
per_listener_settings false

listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

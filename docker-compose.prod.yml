name: societyos-prod

# Bounded json-file logs: the default driver grows without limit and can fill
# the host disk that also holds postgres_data.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    env_file: .env.production
    # Docker's 64 MB /dev/shm default breaks parallel queries and large sorts.
    shm_size: 256mb
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  redis:
    image: redis:7.4.12-alpine3.21
    restart: unless-stopped
    # Auth is mandatory: every container on the network can reach Redis. The
    # password comes from a secret file rather than env_file so Redis never
    # receives the app's other secrets. REDIS_URL in .env.production must
    # carry the same value. Going through docker-entrypoint.sh keeps the drop
    # to the redis user.
    secrets: [redis_password]
    command:
      - sh
      - -c
      - >-
        REDIS_PASSWORD="$$(cat /run/secrets/redis_password)" &&
        { [ -n "$$REDIS_PASSWORD" ] || { echo "redis_password secret is empty" >&2; exit 1; }; } &&
        exec docker-entrypoint.sh redis-server --appendonly yes
        --maxmemory 256mb --maxmemory-policy allkeys-lru
        --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    env_file: .env.production
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    volumes:
      - ./infrastructure/docker/mosquitto/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infrastructure/docker/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./infrastructure/docker/mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_pub -h 127.0.0.1 -p 1883 -u $$MQTT_USERNAME -P $$MQTT_PASSWORD -t society/healthcheck -m ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    # Non-secret values come from .env.production (see .env.production.example).
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      ENABLE_SWAGGER: "false"
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/v1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [private]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Baked into the Next.js rewrite at build time (see apps/web/Dockerfile).
      args:
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [private]

  nginx:
    image: nginx:1.30.6-alpine3.24
    restart: unless-stopped
    # Set NGINX_HTTP_BIND=127.0.0.1:80 (shell or ./.env) when the TLS
    # terminator runs on this host, so plaintext :80 is not internet-facing.
    ports:
      - "${NGINX_HTTP_BIND:-80}:80"
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

secrets:
  redis_password:
    # Generate with: openssl rand -hex 24 > infrastructure/docker/redis/password
    file: ./infrastructure/docker/redis/password

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:

networks:
  private:
    driver: bridge
